<!doctype html>
<!-- Page ouverte par le bouton « Confirmer mon compte » de l'e-mail d'inscription (19 novembre 2026).
     En ligne : https://timeowdm.github.io/nextlap/confirme.html (dépôt timeowdm/timeowdm.github.io).
     Supabase confirme le compte AVANT d'arriver ici ; en cas d'erreur (lien expiré, déjà utilisé),
     il ajoute #error=...&error_description=... à l'adresse et la page l'affiche. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B0B0F">
<title>Compte confirmé · NextLap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0B0B0F; --card:#1C1C22; --neon:#C6FF00; --text:#FFFFFF; --muted:#A3A3AD; --line:#2A2A32; --danger:#FF4D5E; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--text); font-family:Archivo, Helvetica, Arial, sans-serif; }
  main { min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:32px 16px; }
  .card { width:100%; max-width:440px; background:var(--card); border-radius:14px; border-top:3px solid var(--neon); padding:36px 28px 30px; }
  .brand { display:flex; align-items:center; gap:12px; margin-bottom:28px; }
  .brand img { width:48px; height:48px; border-radius:11px; display:block; }
  .brand span { font-family:'Archivo Black', 'Arial Black', sans-serif; font-style:italic; font-size:22px; letter-spacing:1px; }
  .kicker { margin:0 0 10px; font-size:12px; font-weight:600; letter-spacing:2px; color:var(--muted); text-transform:uppercase; }
  h1 { margin:0 0 16px; font-family:'Archivo Black', 'Arial Black', sans-serif; font-style:italic; font-size:30px; line-height:1.1; text-transform:uppercase; }
  p { margin:0; font-size:16px; line-height:1.55; color:#D6D6DC; }
  .steps { margin:24px 0 0; padding:0; list-style:none; border-top:1px solid var(--line); }
  .steps li { display:flex; gap:12px; padding:14px 0; border-bottom:1px solid var(--line); font-size:15px; line-height:1.45; color:#D6D6DC; }
  .steps b { font-family:'Archivo Black', 'Arial Black', sans-serif; color:var(--neon); min-width:18px; }
  .error h1 { color:var(--text); }
  .error .kicker { color:var(--danger); }
  footer { margin-top:24px; font-size:12px; color:#6E6E78; text-align:center; }
  footer a { color:var(--muted); }
</style>
</head>
<body>
<main>
  <div class="card" id="card">
    <div class="brand"><img src="logo.png" alt=""><span>NEXTLAP</span></div>
    <p class="kicker" id="kicker">C'est bon</p>
    <h1 id="title">Compte confirmé</h1>
    <p id="text">Ton adresse est vérifiée. Ton espace pilote t'attend dans l'app.</p>
    <ol class="steps" id="steps">
      <li><b>1</b><span>Ouvre NextLap sur ton téléphone.</span></li>
      <li><b>2</b><span>Connecte-toi avec ton e-mail et ton mot de passe.</span></li>
      <li><b>3</b><span>Trois étapes et ta saison est lancée.</span></li>
    </ol>
  </div>
  <footer>Une question : <a href="mailto:nextlap.contact@gmail.com">nextlap.contact@gmail.com</a></footer>
</main>
<script>
  // Lien expiré ou déjà utilisé : Supabase le signale dans l'adresse (#error=...).
  var h = new URLSearchParams(location.hash.slice(1));
  var q = new URLSearchParams(location.search);
  var err = h.get('error') || q.get('error');
  if (err) {
    var code = h.get('error_code') || q.get('error_code') || '';
    // Cas le plus courant : le lien a déjà servi (2e appui, ou messagerie qui l'a ouvert avant) : le compte est confirmé.
    document.getElementById('kicker').textContent = 'Lien déjà utilisé';
    document.getElementById('title').textContent = code === 'otp_expired' ? 'Compte sans doute déjà confirmé' : 'Confirmation impossible';
    document.getElementById('text').textContent = 'Ce lien ne sert qu’une fois. Ouvre NextLap et connecte-toi : si ça marche, tout est bon. Sinon, recrée ton compte pour recevoir un nouvel e-mail.';
    if (code !== 'otp_expired') document.getElementById('card').classList.add('error');
    document.getElementById('steps').style.display = 'none';
  }
  // On nettoie la barre d'adresse (codes techniques ajoutés par Supabase).
  if (location.hash || location.search) history.replaceState(null, '', location.pathname);
</script>
</body>
</html>
